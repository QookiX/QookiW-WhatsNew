name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每 20 分钟检查一次。数据没变化就跳过部署，
    # 一天最多 72 次，远低于 Vercel Hobby 每天 100 次的上限。
    - cron: '*/20 * * * *'

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # 定时触发时先抓一次数据比对，没变化就不必重建
      - name: Check whether data changed
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/sync-data.mjs --full
            if node scripts/has-changed.mjs; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "数据没有变化，跳过部署"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # vercel pull 会把项目配置和 Vercel 上的环境变量拉到本地，
      # 之后的 vercel build 就能用上 Vercel 里的 GITHUB_TOKEN 去抓数据
      - name: Pull Vercel project config
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      # Vercel 上的 sensitive 变量拉不下来（会变成 [SENSITIVE] 占位符），
      # 所以用 GitHub 自己的令牌覆盖掉，构建时的 sync 才能真正抓到数据
      - name: Inject GitHub token
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .vercel/.env.production.local ]; then
            sed -i '/^GITHUB_TOKEN=/d' .vercel/.env.production.local
          fi
          echo "GITHUB_TOKEN=$TOKEN" >> .vercel/.env.production.local

      - name: Build
        run: npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel
        if: steps.check.outputs.changed == 'true'
        run: npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
