name: Refresh data

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）触发一次重新部署
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "未配置 VERCEL_DEPLOY_HOOK，跳过。在 Vercel 项目 Settings → Git → Deploy Hooks 里创建后，把它加到仓库 Secrets 即可。"
            exit 0
          fi
          curl -sS -X POST "$HOOK"
          echo "已触发 Vercel 重新构建"
