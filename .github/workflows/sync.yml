name: Refresh data

on:
  schedule:
    # 每 10 分钟检查一次（GitHub 在高峰期可能延迟或跳过）
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-data.mjs --full

      - name: Trigger Vercel rebuild when data changed
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "未配置 VERCEL_DEPLOY_HOOK，跳过。"
            echo "在 Vercel 项目 Settings → Git → Deploy Hooks 里创建后，把 URL 加到仓库 Secrets。"
            exit 0
          fi

          if node scripts/has-changed.mjs; then
            echo "数据没有变化，跳过部署"
            exit 0
          fi

          echo "检测到数据变化，触发 Vercel 重新构建"
          curl -sS -X POST "$HOOK"
