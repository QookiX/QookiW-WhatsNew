name: Refresh data

on:
  schedule:
    # 每 10 分钟检查一次。注意：GitHub 的 schedule 队列高峰时会延迟数小时，
    # 实际频率取决于平台负载，不是精确时钟。
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh]

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-data.mjs --full

      - name: Trigger Vercel rebuild when data changed
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::未配置 VERCEL_DEPLOY_HOOK，本次不会触发 Vercel 部署。"
            echo "::warning::在 Vercel 项目 Settings → Git → Deploy Hooks 创建一个 hook（分支填 main），"
            echo "::warning::再把 URL 加到仓库 Settings → Secrets and variables → Actions。"
            echo "::warning::临时方案：Vercel 项目页点 Redeploy，或本地 npm run sync:full 后 push。"
            exit 0
          fi

          if node scripts/has-changed.mjs; then
            echo "数据没有变化，跳过部署"
            exit 0
          fi

          echo "检测到数据变化，触发 Vercel 重新构建"
          curl -sS -X POST "$HOOK"
